name: Archive audit
on:
  push:
    branches: [archive-modernization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5 pypdf==6.1.3
      - run: python scripts/audit_sources.py
      - run: java scripts/InspectDatastore.java war/WEB-INF/appengine-generated/local_db.bin
