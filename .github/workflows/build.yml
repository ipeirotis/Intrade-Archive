name: Build and validate archive
on:
  push:
    branches: [master, archive-modernization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js
      - run: python scripts/build_archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: intrade-research
          path: build/research/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: intrade-site
          path: build/site/
          retention-days: 30
