name: Build and validate archive
on:
  push:
    branches: [master, archive-modernization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: archive-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js
      - run: python scripts/build_archive.py
      - run: python examples/load_contract.py
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
      - run: python scripts/make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: intrade-release
          path: build/release/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: build/*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: intrade-research
          path: build/research/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: intrade-site
          path: build/site/
          retention-days: 30
